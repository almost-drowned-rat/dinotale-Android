<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800">
  <!-- DinoTale's launcher motif: a stitched hill with a round tree, a bush and a speckled egg.
       Drawn for DinoTale, GPL-3.0-or-later. -->
  <!-- hill -->
  <path d="M20 800 C 60 560 260 470 500 470 C 740 470 940 560 980 800 Z" fill="#3f9a3a"/>
  <path d="M60 800 C 100 590 280 505 500 505 C 720 505 900 590 940 800" fill="none" stroke="#c9f0b0" stroke-width="7" stroke-dasharray="20 14" stroke-linecap="round" stroke-opacity="0.8"/>
  <!-- tree -->
  <g transform="translate(-230 0)">
  <rect x="742" y="300" width="40" height="200" rx="16" fill="#8a5a33"/>
  <circle cx="762" cy="250" r="120" fill="#2f8a3a"/>
  <circle cx="700" cy="290" r="78" fill="#36983f"/>
  <circle cx="830" cy="285" r="80" fill="#36983f"/>
  <circle cx="762" cy="250" r="102" fill="none" stroke="#bfeaa5" stroke-width="6" stroke-dasharray="16 12" stroke-linecap="round" stroke-opacity="0.75"/>
  <circle cx="725" cy="215" r="14" fill="#ff6f7d"/>
  <circle cx="805" cy="200" r="14" fill="#ff6f7d"/>
  <circle cx="790" cy="300" r="14" fill="#ff6f7d"/>
  </g>
  <!-- bush -->
  <g transform="translate(-40 0)">
    <circle cx="300" cy="455" r="58" fill="#2f8a3a"/>
    <circle cx="250" cy="475" r="42" fill="#36983f"/>
    <circle cx="352" cy="472" r="44" fill="#36983f"/>
    <circle cx="300" cy="455" r="44" fill="none" stroke="#bfeaa5" stroke-width="5" stroke-dasharray="12 10" stroke-linecap="round" stroke-opacity="0.75"/>
    <circle cx="280" cy="440" r="8" fill="#ffd84d"/>
    <circle cx="322" cy="462" r="8" fill="#ff8fb1"/>
  </g>
  <!-- egg -->
  <g transform="translate(90 0)">
  <path d="M600 520 C 560 520 548 460 570 420 C 586 392 614 392 630 420 C 652 460 640 520 600 520 Z" fill="#fff7e6"/>
  <circle cx="588" cy="440" r="9" fill="#e7a35a"/>
  <circle cx="614" cy="468" r="7" fill="#e7a35a"/>
  <circle cx="585" cy="492" r="6" fill="#e7a35a"/>
  <circle cx="620" cy="432" r="5" fill="#e7a35a"/>
